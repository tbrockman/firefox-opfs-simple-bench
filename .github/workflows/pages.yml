# Publishes the committed benchmark results to GitHub Pages on every push to
# main. Nothing is benchmarked here: automation/site.mjs copies the
# results/<run>/ directories into the site and uses the newest run's
# report.html as the front page. Requires Pages source = "GitHub Actions" in
# the repository settings.
name: Publish results to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site from committed results
        run: node automation/site.mjs results _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
